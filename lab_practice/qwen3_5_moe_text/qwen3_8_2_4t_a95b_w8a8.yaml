#
# Qwen3.8-2.4T-A95B (text-only MoE) W8A8 dynamic quantisation.
#
# Scope derived from the published FP8 checkpoint
# (Qwen/Qwen3.8-2.4T-A95B-FP8, config.json -> quantization_config.
# modules_to_not_convert, 978 entries).  Inverting that list leaves exactly one
# quantised module family:  the routed experts `mlp.experts.*`.
#
# Everything else is excluded by the model authors, and this config follows them:
#   * all `linear_attn.*` projections  -- the GatedDeltaNet / Mamba-style path
#   * all `self_attn.{q,k,v,o}_proj`   -- only present on the 23 full-attention
#                                         layers (full_attention_interval = 4)
#   * `mlp.gate`, `mlp.shared_expert.*`, `mlp.shared_expert_gate`
#   * `mtp.*` linear layers, `lm_head`, `model.embed_tokens`
#
# NOTE: this practice config has NOT been validated on Ascend hardware.  It
# deliberately declares no `verified_model_types` / `verified_tags` -- those
# fields mean "confirmed by the project", and no such confirmation exists here.
# See README.md for the verification table and QWEN38.md for the experiment plan.
apiversion: modelslim_v1
metadata:
  config_id: qwen3_8_2_4t_a95b_w8a8
  score: 70
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*mlp.experts*"
      exclude:
        - "*shared_expert*"
        - "*mlp.gate*"
        - "mtp*"
  dataset: qwen38_calib.jsonl
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
