#
# Qwen3.8-27B (dense VLM) W8A8 dynamic quantisation.
#
# Scope derived from the published FP8 checkpoint
# (Qwen/Qwen3.8-27B-FP8, config.json -> quantization_config.
# modules_to_not_convert, 882 entries).  Inverting that list leaves:
#
#   * `self_attn.{q,k,v,o}_proj`   -- all 64 layers
#   * `mlp.{gate,up,down}_proj`    -- all 64 layers
#   * `linear_attn.out_proj`       -- the 48 linear-attention layers
#
# Excluded by the model authors, and followed here:
#   * the entire vision tower (`visual.*`)
#   * every norm (`input_layernorm`, `post_attention_layernorm`,
#     `self_attn.{q,k}_norm`, `linear_attn.norm`)
#   * `linear_attn.{A_log, conv1d, dt_bias, in_proj_a, in_proj_b, in_proj_ba}`
#   * `mlp.gate`, `mlp.shared_expert_gate`
#   * `mtp.{fc, norm, pre_fc_norm_*}` and `mtp.layers.*` non-linear parts
#   * `lm_head`, `model.embed_tokens`
#
# Qwen3.8-27B is dense: its config has no `num_experts`.  The
# `mlp.shared_expert_gate` entry in the exclusion list is a vestigial config key
# with no corresponding module, kept in the exclude patterns below so that the
# intent matches the published list literally.
#
# NOTE: this practice config has NOT been validated on Ascend hardware, and
# declares no verification.  See README.md.
apiversion: multimodal_vlm_modelslim_v1
metadata:
  config_id: qwen3_8_27b_w8a8
  score: 70
  label:
    w_bit: 8
    a_bit: 8
    is_sparse: False
    kv_cache: False

default_w8a8_dynamic: &default_w8a8_dynamic
  act:
    scope: "per_token"
    dtype: "int8"
    symmetric: True
    method: "minmax"
  weight:
    scope: "per_channel"
    dtype: "int8"
    symmetric: True
    method: "minmax"

spec:
  process:
    - type: "linear_quant"
      qconfig: *default_w8a8_dynamic
      include:
        - "*self_attn.q_proj*"
        - "*self_attn.k_proj*"
        - "*self_attn.v_proj*"
        - "*self_attn.o_proj*"
        - "*mlp.gate_proj*"
        - "*mlp.up_proj*"
        - "*mlp.down_proj*"
        - "*linear_attn.out_proj*"
      exclude:
        - "*visual*"
        - "*shared_expert*"
        - "*self_attn.q_norm*"
        - "*self_attn.k_norm*"
        - "mtp*"
  save:
    - type: "ascendv1_saver"
      part_file_size: 4
  dataset: "calibImages"  # Short name: auto-searches in lab_calib/
  # Text-only alternative: `qwen38_calib.jsonl`.  The scope above excludes the
  # whole vision tower, so image calibration cannot influence the quantised
  # modules directly; it still shapes the activations the tower feeds into the
  # text side, so the image path is kept as the default until measured.
  default_text: "Describe this image in detail."
